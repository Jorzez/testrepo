# Стек рассчитан на сервер без доступа в интернет.
#
#   * pull_policy: never — compose никогда не ходит в реестр; образы должны
#     быть загружены заранее (scripts/offline/install.sh делает docker load).
#   * Веса модели читаются из локального каталога ${MODELS_DIR}, а не
#     скачиваются с Hugging Face; HF_HUB_OFFLINE запрещает любые попытки.
#   * Образ API собирается из колёс в api/vendor/wheels, pip к PyPI не ходит.
#
# Подготовка набора на машине с интернетом: scripts/offline/prepare.sh
# Установка на сервере:                     scripts/offline/install.sh

services:
  neo4j:
    image: neo4j:5.26
    pull_policy: never
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"    # браузер
      - "7687:7687"    # bolt
    volumes:
      - neo4j_data:/data
      - ./neo4j/init:/init:ro
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Разовый сервис: заполняет граф из neo4j/init/seed.cypher.
  # Neo4j 5 не исполняет .cypher из /init сам, поэтому это делает seed.py.
  # Скрипт идемпотентен, поэтому запускается при каждом подъёме стека.
  seeder:
    image: goal-checker-api:${APP_VERSION:-latest}
    build: ./api
    pull_policy: never
    restart: "no"
    command: ["python", "seed.py"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SEED_FILE: /init/seed.cypher
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./neo4j/init:/init:ro
    depends_on:
      neo4j:
        condition: service_healthy

  vllm:
    # Тег зафиксирован: на сервере без интернета «latest» означает
    # «что успели загрузить», а это должно быть видно в конфигурации.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.9.2}
    pull_policy: never
    restart: unless-stopped
    environment:
      # Запрет на любые обращения к Hugging Face и телеметрию.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    # Веса лежат в ${MODELS_DIR}/${VLLM_MODEL_DIR}; наружу модель представляется
    # под именем ${VLLM_MODEL}, чтобы API не зависел от пути на диске.
    command: >
      --model /models/${VLLM_MODEL_DIR:-Qwen3-8B}
      --served-model-name ${VLLM_MODEL}
      --max-model-len 8192
      --gpu-memory-utilization 0.90
    ports:
      - "8000:8000"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    healthcheck:
      # В образе может не быть curl — проверяем средствами Python.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      # Загрузка весов 8B-модели с диска занимает минуты, поэтому длинный start_period.
      start_period: 900s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    image: goal-checker-api:${APP_VERSION:-latest}
    build: ./api
    pull_policy: never
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      VLLM_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      BULK_MAX_WORKERS: ${BULK_MAX_WORKERS:-4}
      MAX_GOALS_PER_REQUEST: ${MAX_GOALS_PER_REQUEST:-200}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8080"
    volumes:
      # Смонтировано на запись, чтобы export_graph.py мог записать seed.cypher.
      - ./neo4j/init:/init
    depends_on:
      neo4j:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
      vllm:
        condition: service_healthy

  # Интерфейс на React: статика собирается в образ (web/Dockerfile) на машине
  # с интернетом и приезжает на сервер готовой — node и npm там не нужны.
  web:
    image: goal-checker-web:${APP_VERSION:-latest}
    build: ./web
    pull_policy: never
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  neo4j_data:
