<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог нормативных требований</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233d5afe'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfcfd; --line:#e3e6ea; --line-soft:#eef0f3;
  --ink:#16181d; --ink-2:#5b6472; --ink-3:#8a93a1;
  --accent:#3d5afe; --accent-ink:#ffffff; --accent-soft:#eaeeff;
  --ok:#1a7f4b; --ok-soft:#e6f5ec;
  --warn:#9a6400; --warn-soft:#fdf3e0;
  --danger:#c0342b; --danger-soft:#fdecea;
  --shadow:0 1px 2px rgba(16,20,28,.06), 0 8px 24px rgba(16,20,28,.06);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216; --panel:#171b21; --panel-2:#1c2128; --line:#2a313a; --line-soft:#232931;
    --ink:#e8ebef; --ink-2:#a3adba; --ink-3:#727d8b;
    --accent:#7c8cff; --accent-ink:#0f1216; --accent-soft:#232a44;
    --ok:#5fd398; --ok-soft:#16301f;
    --warn:#e8b465; --warn-soft:#332614;
    --danger:#ff8f85; --danger-soft:#3a1d1a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;}
button,input,textarea,select{font:inherit;color:inherit}

header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.head-row{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em;font-size:16px;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);letter-spacing:0}
nav{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink-2);
  border-bottom:2px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0;
  display:inline-flex;align-items:center;gap:7px}
nav button:hover{color:var(--ink);background:var(--panel-2)}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:550}
main{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.grow{flex:1 1 220px}

.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.12s}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:550}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:8px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--panel)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{resize:vertical;min-height:78px;line-height:1.5}
label.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  font-size:12px;font-weight:550;border:1px solid transparent;white-space:nowrap}
.badge.prohibition{background:var(--danger-soft);color:var(--danger)}
.badge.requirement{background:var(--accent-soft);color:var(--accent)}
.badge.archived{background:var(--panel-2);color:var(--ink-3);border-color:var(--line)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.err{background:var(--danger-soft);color:var(--danger)}
.badge.count{background:var(--panel-2);color:var(--ink-2);border-color:var(--line);
  min-width:20px;justify-content:center}
.chip{display:inline-flex;padding:2px 9px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3);font-size:13px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.card.is-archived{opacity:.62}
.order-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer}
.order-head:hover{background:var(--panel-2)}
.caret{flex:none;width:18px;color:var(--ink-3);transition:transform .15s;margin-top:2px}
.caret.open{transform:rotate(90deg)}
.order-title{flex:1;min-width:0}
.order-title b{font-size:15.5px}
.order-title .sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.actions{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.menu-btn{min-width:46px;justify-content:center;padding:7px 12px;font-size:18px;
  line-height:1;letter-spacing:1px;font-weight:600}
.popup{position:fixed;z-index:70;min-width:118px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow);padding:3px;display:flex;flex-direction:column}
.popup button{background:none;border:0;text-align:left;padding:5px 9px;border-radius:6px;
  cursor:pointer;font-size:13px;white-space:nowrap;display:flex;gap:9px;align-items:center}
.popup button:hover{background:var(--panel-2)}
.popup button.danger{color:var(--danger)}
.popup button.danger:hover{background:var(--danger-soft)}
.popup .sep{height:1px;background:var(--line-soft);margin:3px 3px}
.clause-head{display:flex;gap:10px;align-items:flex-start;cursor:pointer;border-radius:8px;
  padding:4px 6px;margin:-4px -6px}
.clause-head:hover{background:var(--line-soft)}
.body{border-top:1px solid var(--line-soft);padding:6px 16px 14px 40px;background:var(--panel-2)}
.clause{border-left:2px solid var(--line);padding:11px 0 11px 14px;margin-top:10px}
.clause.is-archived{opacity:.62}
.row{display:flex;gap:10px;align-items:flex-start}
.row .grow{min-width:0}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-top:9px}
.rule.is-archived{opacity:.62}
.rule-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.targets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.examples{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
.example{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px}
.example.is-archived{opacity:.6}
.example .mark{flex:none;font-weight:700;width:16px;text-align:center}
.example.bad .mark{color:var(--danger)}
.example.good .mark{color:var(--ok)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--radius)}
[data-node].flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,55%{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}100%{}}

table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{background:var(--panel-2);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
tr.is-archived{opacity:.6}

.overlay{position:fixed;inset:0;background:rgba(10,13,18,.5);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal.wide{width:min(820px,100%)}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px}
.modal .content{padding:16px 20px;overflow:auto}
.modal .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.field{margin-bottom:14px}
.field > label{display:block;margin-bottom:5px;font-size:13.5px;font-weight:550}
.field .hint{margin-top:5px;font-size:12.5px;color:var(--ink-3)}
.optlist{border:1px solid var(--line);border-radius:8px;max-height:200px;overflow:auto;padding:4px}
.optlist label{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.optlist label:hover{background:var(--panel-2)}
.optlist input{margin-top:3px;flex:none;width:auto}
.optlist .d{color:var(--ink-3);font-size:12.5px}
.prop-row{display:grid;grid-template-columns:minmax(120px,1fr) 108px minmax(160px,2fr) auto;
  gap:8px;align-items:start;margin-bottom:8px}
.prop-row.removed input,.prop-row.removed select{opacity:.45;text-decoration:line-through}

#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:9px;max-width:400px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:9px;padding:11px 14px;box-shadow:var(--shadow);animation:slide .18s ease-out}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
@keyframes slide{from{opacity:0;transform:translateY(8px)}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow)}
.violation{border:1px solid var(--line);border-left:3px solid var(--danger);border-radius:9px;
  padding:12px 14px;margin-top:11px;background:var(--panel-2)}
.issue{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;
  background:var(--panel);box-shadow:var(--shadow);border-left:3px solid var(--ink-3)}
.issue.error{border-left-color:var(--danger)}
.issue.warning{border-left-color:var(--warn)}
.issue.info{border-left-color:var(--accent)}
.issue h4{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.issue .detail{color:var(--ink-2);font-size:13.5px}
.issue .items{margin-top:11px;display:flex;flex-direction:column;gap:5px}
.issue .item{display:flex;gap:9px;align-items:center;justify-content:space-between;
  padding:6px 9px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:7px;font-size:13.5px}
.spinner{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none !important}
</style>
</head>
<body>

<header>
  <div class="head-row">
    <div class="brand">Каталог нормативных требований<small id="apiLabel"></small></div>
    <span id="apiStatus" class="badge archived">подключение…</span>
    <button class="btn sm" id="reloadBtn">Обновить</button>
  </div>
  <nav role="tablist">
    <button role="tab" data-tab="catalog" aria-selected="true">Приказы и пункты</button>
    <button role="tab" data-tab="targets" aria-selected="false">Атрибуты</button>
    <button role="tab" data-tab="check" aria-selected="false">Проверка цели</button>
    <button role="tab" data-tab="health" aria-selected="false">Диагностика
      <span id="healthCount" class="badge count hidden">0</span></button>
  </nav>
</header>

<main>
  <section id="tab-catalog">
    <div class="toolbar">
      <input type="text" id="search" class="grow" placeholder="Поиск по номеру, заголовку, тексту пункта, правила или примера…">
      <button class="btn sm" id="expandAll">Раскрыть все</button>
      <button class="btn sm" id="collapseAll">Свернуть</button>
      <label class="check"><input type="checkbox" id="showArchived"> Архив</label>
      <button class="btn primary" id="addOrder">Создать</button>
    </div>
    <div id="tree"></div>
  </section>

  <section id="tab-targets" class="hidden">
    <div class="toolbar">
      <div class="grow muted">Атрибут без описания модель системно не распознаёт — правило на нём будет срабатывать всегда.</div>
      <label class="check"><input type="checkbox" id="showArchivedTargets"> Архив</label>
      <button class="btn primary" id="addTarget">Создать</button>
    </div>
    <div id="targetsTable"></div>
  </section>

  <section id="tab-check" class="hidden">
    <div class="panel">
      <div class="field">
        <label for="goalInput">Формулировка цели</label>
        <textarea id="goalInput" placeholder="Например: снизить долю просроченных заявок до 5% к 31.12.2025 в рамках проекта «Альфа»"></textarea>
      </div>
      <button class="btn primary" id="checkBtn">Проверить</button>
    </div>
    <div id="checkResult"></div>
  </section>

  <section id="tab-health" class="hidden">
    <div class="toolbar">
      <div class="grow muted">Что мешает проверкам работать честно. «Показать» ведёт к конкретному объекту.</div>
      <button class="btn" id="healthRefresh">Проверить снова</button>
    </div>
    <div id="healthPanel"></div>
  </section>
</main>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
"use strict";

/* Адрес API. По умолчанию тот же хост, порт 8080 — работает и локально,
   и через SSH-туннель. Переопределяется через ?api=http://host:port */
const API = new URLSearchParams(location.search).get("api")
         || `${location.protocol}//${location.hostname}:8080`;
document.getElementById("apiLabel").textContent = API;

const state = {
  tab: "catalog",
  tree: { orders: [] },
  targets: [],
  clauses: [],
  showArchived: false,
  showArchivedTargets: false,
  search: "",
  open: new Set(),          // nodeId раскрытых приказов
  openClauses: new Set(),   // nodeId раскрытых пунктов
};

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel) => document.querySelector(sel);
const enc = encodeURIComponent;

function toast(message, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = message;
  $("#toasts").append(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = ".3s"; }, 4200);
  setTimeout(() => el.remove(), 4600);
}

async function api(path, options = {}) {
  const response = await fetch(API + path, {
    headers: { "Content-Type": "application/json" },
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  let payload = null;
  try { payload = await response.json(); } catch { /* пустой ответ */ }
  if (!response.ok) {
    const detail = payload && payload.detail;
    throw new Error(typeof detail === "string" ? detail
      : Array.isArray(detail) ? detail.map((d) => d.msg || JSON.stringify(d)).join("; ")
      : `HTTP ${response.status}`);
  }
  return payload;
}

/* ------------------------------- меню ------------------------------------ */

/* Все операции над приказом, пунктом, правилом и атрибутом собраны в одно
   выпадающее меню: иначе строка действий шире самого содержимого.
   У примеров кнопки остаются на виду — их всего три и они частые. */

const MENUS = {
  Order: (n) => [
    { label: "Изменить", act: "order-edit" },
    { label: "Создать пункт", act: "clause-add" },
    { label: "Свойства", act: "props" },
    null,
    n.status === "archived"
      ? { label: "Вернуть", act: "restore" }
      : { label: "В архив", act: "archive" },
    { label: "Удалить", act: "delete", danger: true },
  ],
  Clause: (n) => [
    { label: "Изменить", act: "clause-edit" },
    { label: "Создать правило", act: "rule-add" },
    { label: "Свойства", act: "props" },
    { label: "Ссылки", act: "clause-refs" },
    { label: "Перенести", act: "clause-move" },
    null,
    n.status === "archived"
      ? { label: "Вернуть", act: "restore" }
      : { label: "В архив", act: "archive" },
    { label: "Удалить", act: "delete", danger: true },
  ],
  Rule: (n) => [
    { label: "Изменить", act: "rule-edit" },
    { label: "Атрибуты", act: "rule-targets" },
    { label: "Создать пример", act: "example-add" },
    { label: "Свойства", act: "props" },
    { label: "Перенести", act: "rule-move" },
    null,
    n.status === "archived"
      ? { label: "Вернуть", act: "restore" }
      : { label: "В архив", act: "archive" },
    { label: "Удалить", act: "delete", danger: true },
  ],
  CheckTarget: (n) => [
    { label: "Изменить", act: "target-edit" },
    { label: "Свойства", act: "props" },
    null,
    n.status === "archived"
      ? { label: "Вернуть", act: "restore" }
      : { label: "В архив", act: "archive" },
    { label: "Удалить", act: "delete", danger: true },
  ],
};

const menuButton = (kind, id) =>
  `<button class="btn sm menu-btn" data-menu data-kind="${kind}" data-id="${esc(id)}"
     title="Действия" aria-label="Действия">⋯</button>`;

function closeMenu() {
  const popup = document.querySelector(".popup");
  if (popup) popup.remove();
}

function openMenu(trigger) {
  closeMenu();
  const node = findAny(trigger.dataset.id) || {};
  const items = (MENUS[trigger.dataset.kind] || (() => []))(node);
  const popup = document.createElement("div");
  popup.className = "popup";
  popup.innerHTML = items.map((item) => item
    ? `<button data-act="${item.act}" data-id="${esc(trigger.dataset.id)}"
         class="${item.danger ? "danger" : ""}">${esc(item.label)}</button>`
    : '<div class="sep"></div>').join("");
  document.body.append(popup);

  const rect = trigger.getBoundingClientRect();
  const width = popup.offsetWidth;
  popup.style.left = Math.max(8, Math.min(rect.right - width, innerWidth - width - 8)) + "px";
  const below = rect.bottom + 6;
  popup.style.top = (below + popup.offsetHeight > innerHeight - 8
    ? Math.max(8, rect.top - popup.offsetHeight - 6) : below) + "px";
}

/* ------------------------------ модалки ---------------------------------- */

function closeModal() { $("#modalRoot").innerHTML = ""; }

function renderField(f) {
  const id = "f_" + f.name;
  let control;
  if (f.type === "textarea") {
    control = `<textarea id="${id}" ${f.required ? "required" : ""}
      placeholder="${esc(f.placeholder || "")}">${esc(f.value || "")}</textarea>`;
  } else if (f.type === "select") {
    control = `<select id="${id}">${f.options.map((o) =>
      `<option value="${esc(o.value)}" ${o.value === f.value ? "selected" : ""}>${esc(o.label)}</option>`
    ).join("")}</select>`;
  } else if (f.type === "checkbox") {
    return `<div class="field"><label class="check">
      <input type="checkbox" id="${id}" ${f.value ? "checked" : ""}> ${esc(f.label)}</label>
      ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
  } else if (f.type === "multi") {
    control = `<div class="optlist" id="${id}">${
      f.options.length
        ? f.options.map((o) => `<label><input type="checkbox" value="${esc(o.value)}"
            ${(f.value || []).includes(o.value) ? "checked" : ""}>
            <span><span class="mono">${esc(o.label || o.value)}</span>${
              o.description ? `<br><span class="d">${esc(o.description)}</span>` : ""
            }</span></label>`).join("")
        : `<div class="d" style="padding:10px">${esc(f.emptyText || "Список пуст.")}</div>`
    }</div>`;
  } else {
    control = `<input type="${f.type || "text"}" id="${id}" value="${esc(f.value || "")}"
      placeholder="${esc(f.placeholder || "")}" ${f.required ? "required" : ""}>`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}</label>${control}
    ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
}

function readField(f) {
  const el = document.getElementById("f_" + f.name);
  if (f.type === "checkbox") return el.checked;
  if (f.type === "multi") return [...el.querySelectorAll("input:checked")].map((i) => i.value);
  return el.value.trim();
}

function openForm({ title, fields, submitLabel = "Сохранить", wide = false, onSubmit }) {
  $("#modalRoot").innerHTML = `<div class="overlay"><form class="modal ${wide ? "wide" : ""}">
    <h3>${esc(title)}</h3>
    <div class="content">${fields.map(renderField).join("")}</div>
    <div class="foot">
      <button type="button" class="btn" data-close>Отмена</button>
      <button type="submit" class="btn primary">${esc(submitLabel)}</button>
    </div></form></div>`;

  const form = $("#modalRoot form");
  form.querySelector("[data-close]").onclick = closeModal;
  $("#modalRoot .overlay").onclick = (e) => { if (e.target.classList.contains("overlay")) closeModal(); };
  const first = form.querySelector("input,textarea,select");
  if (first) first.focus();

  form.onsubmit = async (e) => {
    e.preventDefault();
    const values = {};
    for (const f of fields) {
      values[f.name] = readField(f);
      if (f.required && !values[f.name]) { toast(`Заполните поле «${f.label}»`, "err"); return; }
    }
    const submit = form.querySelector('button[type="submit"]');
    submit.disabled = true;
    submit.innerHTML = '<span class="spinner"></span> Сохранение…';
    try {
      await onSubmit(values);
      closeModal();
    } catch (err) {
      toast(err.message, "err");
      submit.disabled = false;
      submit.textContent = submitLabel;
    }
  };
}

function confirmDialog({ title, message, confirmLabel = "Подтвердить", danger = false }) {
  return new Promise((resolve) => {
    $("#modalRoot").innerHTML = `<div class="overlay"><div class="modal">
      <h3>${esc(title)}</h3>
      <div class="content">${message}</div>
      <div class="foot">
        <button class="btn" data-no>Отмена</button>
        <button class="btn ${danger ? "danger" : "primary"}" data-yes>${esc(confirmLabel)}</button>
      </div></div></div>`;
    const done = (v) => { closeModal(); resolve(v); };
    $("#modalRoot [data-no]").onclick = () => done(false);
    $("#modalRoot [data-yes]").onclick = () => done(true);
    $("#modalRoot [data-yes]").focus();
  });
}

/* --------------------- редактор произвольных свойств --------------------- */

const PROP_TYPES = [
  { value: "string", label: "строка" },
  { value: "number", label: "число" },
  { value: "boolean", label: "да/нет" },
  { value: "date", label: "дата" },
];

function guessType(value) {
  if (typeof value === "boolean") return "boolean";
  if (typeof value === "number") return "number";
  if (typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value)) return "date";
  return "string";
}

function propRow(key, value, isNew = false) {
  const type = guessType(value);
  return `<div class="prop-row" data-prop>
    <input type="text" data-key value="${esc(key)}" placeholder="имя свойства" ${isNew ? "" : "readonly"}>
    <select data-type>${PROP_TYPES.map((t) =>
      `<option value="${t.value}" ${t.value === type ? "selected" : ""}>${t.label}</option>`).join("")}</select>
    <input type="text" data-value value="${esc(value === null || value === undefined ? "" : value)}"
      placeholder="значение">
    <button type="button" class="btn sm ghost" data-drop title="Удалить свойство">✕</button>
  </div>`;
}

async function openProperties(nodeId) {
  let node;
  try { node = await api(`/catalog/nodes/${enc(nodeId)}`); }
  catch (err) { toast(err.message, "err"); return; }

  const skip = new Set(["nodeId", "labels", "status"]);
  const entries = Object.entries(node).filter(([k]) => !skip.has(k));

  $("#modalRoot").innerHTML = `<div class="overlay"><form class="modal wide">
    <h3>Свойства узла :${esc((node.labels || []).join(":"))}</h3>
    <div class="content">
      <div class="dim" style="margin-bottom:12px">
        Здесь можно править любое свойство, включая ключевые. Ключ проверяется
        на уникальность: выгрузка в seed.cypher строит по нему MERGE.
        Статус меняется кнопками «В архив» / «Вернуть».
      </div>
      <div id="propRows">${entries.map(([k, v]) => propRow(k, v)).join("")}</div>
      <button type="button" class="btn sm" id="addProp">+ Свойство</button>
      <div class="hint" style="margin-top:12px">
        <span class="mono">${esc(nodeId)}</span> — внутренний идентификатор узла Neo4j.
      </div>
    </div>
    <div class="foot">
      <button type="button" class="btn" data-close>Отмена</button>
      <button type="submit" class="btn primary">Сохранить</button>
    </div></form></div>`;

  const form = $("#modalRoot form");
  form.querySelector("[data-close]").onclick = closeModal;
  $("#addProp").onclick = () => {
    $("#propRows").insertAdjacentHTML("beforeend", propRow("", "", true));
  };
  form.addEventListener("click", (e) => {
    const drop = e.target.closest("[data-drop]");
    if (drop) drop.closest("[data-prop]").classList.toggle("removed");
  });

  form.onsubmit = async (e) => {
    e.preventDefault();
    const properties = {};
    for (const row of form.querySelectorAll("[data-prop]")) {
      const key = row.querySelector("[data-key]").value.trim();
      if (!key) continue;
      if (row.classList.contains("removed")) { properties[key] = null; continue; }
      const type = row.querySelector("[data-type]").value;
      const raw = row.querySelector("[data-value]").value.trim();
      if (type === "number") {
        const n = Number(raw);
        if (raw !== "" && Number.isNaN(n)) { toast(`«${key}»: не число`, "err"); return; }
        properties[key] = raw === "" ? null : n;
      } else if (type === "boolean") {
        properties[key] = /^(да|true|1|yes)$/i.test(raw);
      } else {
        properties[key] = raw;
      }
    }
    const submit = form.querySelector('button[type="submit"]');
    submit.disabled = true;
    submit.innerHTML = '<span class="spinner"></span> Сохранение…';
    try {
      await api(`/catalog/nodes/${enc(nodeId)}/properties`, { method: "PATCH", body: { properties } });
      closeModal();
      toast("Свойства сохранены", "ok");
      await reload();
    } catch (err) {
      toast(err.message, "err");
      submit.disabled = false;
      submit.textContent = "Сохранить";
    }
  };
}

async function reload() {

  try {
    const [tree, targets, clauses] = await Promise.all([
      api(`/catalog/tree?include_archived=${state.showArchived}`),
      api(`/catalog/check-targets?include_archived=${state.showArchivedTargets}`),
      api("/catalog/clauses"),
    ]);

    state.clauses = clauses.clauses;

async function mutate(fn, successMessage) {
  await fn();
  if (successMessage) toast(successMessage, "ok");
  await reload();
}

/* ------------------------------ каталог ---------------------------------- */

function matchesSearch(order) {
  const q = state.search.trim().toLowerCase();
  if (!q) return true;
  const haystack = [order.number, order.title, order.orderId, ...(order.clauses || []).flatMap((c) =>
    [c.code, c.text, c.clauseId, ...(c.rules || []).flatMap((r) => [
      r.ruleId, r.description, r.checkInstruction,
      ...(r.targets || []), ...(r.examples || []).map((e) => e.text),
    ])]
  )].join(" ").toLowerCase();
  return haystack.includes(q);
}

/* При активном поиске совпавшие узлы раскрываются сами: иначе результат
   прячется внутри свёрнутых пунктов. */
function clauseMatches(clause) {
  const q = state.search.trim().toLowerCase();
  if (!q) return false;
  return [clause.code, clause.text, clause.clauseId, ...(clause.rules || []).flatMap((r) => [
    r.ruleId, r.description, r.checkInstruction,
    ...(r.targets || []), ...(r.examples || []).map((e) => e.text),
  ])].join(" ").toLowerCase().includes(q);
}

const isOrderOpen = (order) =>
  state.open.has(order.nodeId) || (!!state.search.trim() && matchesSearch(order));
const isClauseOpen = (clause) =>
  state.openClauses.has(clause.nodeId) || clauseMatches(clause);

const archivedBadge = (s) => s === "archived" ? '<span class="badge archived">в архиве</span>' : "";
const idBadge = (v, name) => v ? "" :
  `<span class="badge warn" title="Без ${name} узел не попадёт в выгрузку">нет ${name}</span>`;

function renderExample(ex) {
  return `<div class="example ${ex.isViolation ? "bad" : "good"} ${ex.status === "archived" ? "is-archived" : ""}"
      data-node="${esc(ex.nodeId)}">
    <span class="mark">${ex.isViolation ? "✗" : "✓"}</span>
    <span class="grow">${esc(ex.text)} ${archivedBadge(ex.status)}</span>
    <span class="actions">
      <button class="btn sm ghost" data-act="example-edit" data-id="${esc(ex.nodeId)}">изменить</button>
      <button class="btn sm ghost" data-act="props" data-id="${esc(ex.nodeId)}">свойства</button>
      ${ex.status === "archived"
        ? `<button class="btn sm ghost" data-act="restore" data-id="${esc(ex.nodeId)}">вернуть</button>`
        : `<button class="btn sm ghost" data-act="archive" data-id="${esc(ex.nodeId)}">в архив</button>`}
      <button class="btn sm ghost" data-act="example-del" data-id="${esc(ex.nodeId)}">удалить</button>
    </span></div>`;
}

function renderRule(rule) {
  const type = rule.type === "PROHIBITION"
    ? '<span class="badge prohibition">Запрет</span>'
    : '<span class="badge requirement">Требование</span>';
  const noTargets = !(rule.targets || []).length
    ? '<span class="badge warn">нет атрибутов — правило не сработает</span>' : "";

  return `<div class="rule ${rule.status === "archived" ? "is-archived" : ""}" data-node="${esc(rule.nodeId)}">
    <div class="row">
      <div class="grow">
        <div class="rule-meta">${type}<span class="mono">${esc(rule.ruleId || "")}</span>
          ${idBadge(rule.ruleId, "ruleId")}${archivedBadge(rule.status)}${noTargets}</div>
        <div>${esc(rule.description)}</div>
        ${rule.checkInstruction ? `<div class="dim" style="margin-top:5px">${esc(rule.checkInstruction)}</div>` : ""}
        <div class="targets">
          ${(rule.targets || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}
          <button class="btn sm ghost" data-act="rule-targets" data-id="${esc(rule.nodeId)}">атрибуты…</button>
        </div>
        ${(rule.examples || []).length
          ? `<div class="examples">${rule.examples.map(renderExample).join("")}</div>`
          : '<div class="dim" style="margin-top:8px">Примеров нет — в ответе проверки поле examples будет пустым.</div>'}
      </div>
      <div class="actions">${menuButton("Rule", rule.nodeId)}</div>
    </div></div>`;
}

function renderClause(clause) {
  const open = isClauseOpen(clause);
  const rules = clause.rules || [];
  const refs = (clause.references || []).map((r) => `<span class="chip">→ ${esc(r.code)}</span>`).join(" ");

  return `<div class="clause ${clause.status === "archived" ? "is-archived" : ""}" data-node="${esc(clause.nodeId)}">
    <div class="row">
      <div class="grow clause-head" data-act="toggle-clause" data-id="${esc(clause.nodeId)}">
        <span class="caret ${open ? "open" : ""}">▶</span>
        <div class="grow">
          <div class="row" style="align-items:center;gap:8px;flex-wrap:wrap">
            <b>${esc(clause.code || "(без номера)")}</b>
            ${idBadge(clause.clauseId, "clauseId")}${archivedBadge(clause.status)}
            <span class="dim">${rules.length} прав.</span>
          </div>
          <div style="margin-top:3px">${esc(clause.text)}</div>
        </div>
      </div>
      <div class="actions">${menuButton("Clause", clause.nodeId)}</div>
    </div>
    ${open ? `<div style="padding-left:28px">
      ${refs ? `<div class="targets"><span class="dim">ссылается на:</span> ${refs}</div>` : ""}
      ${rules.map(renderRule).join("")}
      ${rules.length ? "" : '<div class="dim" style="margin-top:8px">Правил нет — пункт ничего не проверяет.</div>'}
    </div>` : ""}
  </div>`;
}

function renderCatalog() {
  const orders = (state.tree.orders || []).filter(matchesSearch);
  if (!orders.length) {
    $("#tree").innerHTML = `<div class="empty">${
      state.search ? "Ничего не найдено." : "Приказов пока нет. Начните с кнопки «Создать»."}</div>`;
    return;
  }
  $("#tree").innerHTML = orders.map((order) => {
    const open = isOrderOpen(order);
    const counts = `${(order.clauses || []).length} п. · ${
      (order.clauses || []).reduce((n, c) => n + (c.rules || []).length, 0)} прав.`;
    return `<div class="card ${order.status === "archived" ? "is-archived" : ""}" data-node="${esc(order.nodeId)}">
      <div class="order-head" data-act="toggle" data-id="${esc(order.nodeId)}">
        <span class="caret ${open ? "open" : ""}">▶</span>
        <div class="order-title">
          <b>${esc(order.number || "(без номера)")}</b>
          ${idBadge(order.orderId, "orderId")}${archivedBadge(order.status)}
          <div class="sub">${esc(order.title || "")}</div>
          <div class="dim">${counts}${order.date ? " · " + esc(order.date) : ""}</div>
        </div>
        <div class="actions">${menuButton("Order", order.nodeId)}</div>
      </div>
      ${open ? `<div class="body">${
        (order.clauses || []).map(renderClause).join("")
        || '<div class="dim" style="padding:10px 0">Пунктов нет.</div>'}</div>` : ""}
    </div>`;
  }).join("");
}

/* --------------------------- поиск по дереву ----------------------------- */

const allOrders = () => state.tree.orders || [];
const allClauses = () => allOrders().flatMap((o) => o.clauses || []);
const allRules = () => allClauses().flatMap((c) => c.rules || []);
const allExamples = () => allRules().flatMap((r) => r.examples || []);
const byNode = (list, id) => list.find((x) => x.nodeId === id);

function findAny(nodeId) {
  return byNode(allOrders(), nodeId) || byNode(allClauses(), nodeId)
      || byNode(allRules(), nodeId) || byNode(allExamples(), nodeId)
      || byNode(state.targets, nodeId);
}

function orderOf(nodeId) {
  for (const order of allOrders()) {
    if (order.nodeId === nodeId) return order;
    for (const clause of order.clauses || []) {
      if (clause.nodeId === nodeId) return order;
      for (const rule of clause.rules || []) {
        if (rule.nodeId === nodeId) return order;
        if ((rule.examples || []).some((e) => e.nodeId === nodeId)) return order;
      }
    }
  }
  return null;
}

const targetOptions = () => state.targets
  .filter((t) => t.status !== "archived")
  .map((t) => ({ value: t.name, label: t.name, description: t.description }));

const clauseOptions = (exclude) => state.clauses
  .filter((c) => c.nodeId !== exclude)
  .map((c) => ({ value: c.nodeId, label: `${c.order_number} — ${c.code}` }));

const RULE_TYPE_OPTIONS = [
  { value: "REQUIREMENT", label: "Требование — нарушено, если атрибута НЕТ в цели" },
  { value: "PROHIBITION", label: "Запрет — нарушен, если атрибут ЕСТЬ в цели" },
];

const patchProps = (nodeId, properties) =>
  api(`/catalog/nodes/${enc(nodeId)}/properties`, { method: "PATCH", body: { properties } });

const ACTIONS = {
  toggle(id) {
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    renderCatalog();
  },

  "toggle-clause"(id) {
    state.openClauses.has(id) ? state.openClauses.delete(id) : state.openClauses.add(id);
    renderCatalog();
  },

  props: (id) => openProperties(id),

  async archive(id) {
    const node = findAny(id);
    if (node && (node.rules || []).length && node.name) {
      const ok = await confirmDialog({
        title: "Атрибут используется",
        confirmLabel: "Всё равно в архив",
        message: `<p>На атрибут <b>${esc(node.name)}</b> ссылаются правила:
          ${node.rules.map((r) => `<span class="chip">${esc(r)}</span>`).join(" ")}.</p>
          <p class="muted">В архиве он перестанет участвовать в проверках, и эти правила
          по нему срабатывать не будут.</p>`,
      });
      if (!ok) return;
    }
    await mutate(() => api(`/catalog/nodes/${enc(id)}/status`,
      { method: "POST", body: { status: "archived" } }), "В архиве");
  },

  async restore(id) {
    await mutate(() => api(`/catalog/nodes/${enc(id)}/status`,
      { method: "POST", body: { status: "active" } }), "Восстановлено");
  },

  async delete(id) {
    let counts = { clauses: 0, rules: 0, examples: 0 };
    try { counts = await api(`/catalog/nodes/${enc(id)}/descendants`); }
    catch (err) { toast(err.message, "err"); return; }
    const parts = [
      counts.clauses ? `<b>${counts.clauses}</b> пункт(ов)` : null,
      counts.rules ? `<b>${counts.rules}</b> правил(а)` : null,
      counts.examples ? `<b>${counts.examples}</b> пример(ов)` : null,
    ].filter(Boolean);
    const ok = await confirmDialog({
      title: "Удалить навсегда?", danger: true, confirmLabel: "Удалить",
      message: `<p>Узел будет удалён из базы${parts.length ? " вместе с " + parts.join(", ") : ""}.</p>

        Если нужно просто отключить узел от проверок — используйте «В архив», это обратимо.</p>`,
    });
    if (!ok) return;
    try {
      await mutate(() => api(`/catalog/nodes/${enc(id)}?force=true`, { method: "DELETE" }), "Удалено");
    } catch (err) { toast(err.message, "err"); }
  },

  "order-add"() {
    openForm({
      title: "Новый приказ", submitLabel: "Создать",
      fields: [
        { name: "number", label: "Номер", required: true, placeholder: "ПР-01" },
        { name: "title", label: "Заголовок", type: "textarea", required: true,

        { name: "date", label: "Дата", type: "date" },
        { name: "orderId", label: "Идентификатор", placeholder: "необязательно",
          hint: "Если не заполнить — будет построен из номера." },
      ],
      onSubmit: (v) => mutate(() => api("/catalog/orders", { method: "POST", body: {
        number: v.number, title: v.title, date: v.date || null, orderId: v.orderId || null } }),
        "Приказ создан"),
    });
  },

  "order-edit"(id) {
    const o = findAny(id) || {};
    openForm({
      title: "Приказ " + (o.number || ""),
      fields: [
        { name: "number", label: "Номер", value: o.number, required: true },
        { name: "title", label: "Заголовок", type: "textarea", value: o.title, required: true },
        { name: "date", label: "Дата", type: "date", value: o.date || "" },

    });

        { name: "text", label: "Текст пункта", type: "textarea", required: true },

        await api("/catalog/clauses", { method: "POST",

      }, "Пункт добавлен"),
    });
  },

  "clause-edit"(id) {
    const c = findAny(id) || {};
    openForm({
      title: "Пункт " + (c.code || ""),
      fields: [
        { name: "code", label: "Номер пункта", value: c.code, required: true },
        { name: "text", label: "Текст пункта", type: "textarea", value: c.text, required: true },
        { name: "clauseId", label: "Идентификатор (clauseId)", value: c.clauseId || "", required: true },
      ],
      onSubmit: (v) => mutate(() => patchProps(id, v), "Пункт обновлён"),
    });
  },

  "clause-refs"(id) {
    const c = findAny(id) || {};
    openForm({
      title: "Перекрёстные ссылки пункта " + (c.code || ""),
      fields: [{ name: "references", label: "Ссылается на пункты", type: "multi",
        value: (c.references || []).map((r) => r.nodeId), options: clauseOptions(id),
        emptyText: "Других пунктов пока нет.",
        hint: "Связь (:Clause)-[:REFERENCES]->(:Clause). На проверку не влияет, нужна для навигации по нормативке." }],
      onSubmit: (v) => mutate(() => api(`/catalog/clauses/${enc(id)}/references`,
        { method: "PUT", body: { references: v.references } }), "Ссылки обновлены"),
    });
  },

  "clause-move"(id) {
    const current = orderOf(id);
    openForm({
      title: "Перенести пункт в другой приказ",
      fields: [{ name: "parentNodeId", label: "Приказ", type: "select",
        value: current ? current.nodeId : "",
        options: allOrders().map((o) => ({ value: o.nodeId, label: o.number || o.orderId })) }],
      onSubmit: (v) => mutate(() => api(`/catalog/clauses/${enc(id)}/move`,
        { method: "POST", body: { parentNodeId: v.parentNodeId } }), "Пункт перенесён"),
    });
  },

  "rule-add"(clauseNodeId) {
    openForm({
      title: "Новое правило", submitLabel: "Создать",
      fields: [
        { name: "type", label: "Тип", type: "select", value: "REQUIREMENT", options: RULE_TYPE_OPTIONS },
        { name: "description", label: "Формулировка правила", type: "textarea", required: true,
          placeholder: "Цель обязана содержать конкретный срок исполнения" },
        { name: "checkInstruction", label: "Что подсказать автору цели", type: "textarea",
          placeholder: "Добавьте в формулировку дату или период завершения",
          hint: "Текст попадает в ответ проверки как check_instruction." },
        { name: "targets", label: "Атрибуты", type: "multi", value: [], options: targetOptions(),
          emptyText: "Атрибутов нет — заведите их на вкладке «Атрибуты».",
          hint: "Правило без атрибутов никогда не сработает." },
      ],
      onSubmit: (v) => mutate(async () => {
        await api("/catalog/rules", { method: "POST", body: {
          clauseNodeId, type: v.type, description: v.description,
          checkInstruction: v.checkInstruction, targets: v.targets } });
        state.openClauses.add(clauseNodeId);
      }, "Правило создано"),
    });
  },

  "rule-edit"(id) {
    const r = findAny(id) || {};
    openForm({
      title: "Правило " + (r.ruleId || ""),
      fields: [
        { name: "type", label: "Тип", type: "select", value: r.type, options: RULE_TYPE_OPTIONS },
        { name: "description", label: "Формулировка правила", type: "textarea",
          value: r.description, required: true },
        { name: "checkInstruction", label: "Что подсказать автору цели", type: "textarea",
          value: r.checkInstruction },
        { name: "ruleId", label: "Идентификатор (ruleId)", value: r.ruleId || "", required: true },
      ],
      onSubmit: (v) => mutate(() => patchProps(id, v), "Правило обновлено"),
    });
  },

  "rule-targets"(id) {
    const r = findAny(id) || {};
    openForm({
      title: "Атрибуты правила " + (r.ruleId || ""),
      fields: [{ name: "targets", label: "Применяется к атрибутам", type: "multi",
        value: r.targets || [], options: targetOptions(),
        emptyText: "Атрибутов нет — заведите их на вкладке «Атрибуты».",
        hint: r.type === "PROHIBITION"
          ? "Запрет сработает, если хотя бы один из атрибутов найден в цели."
          : "Требование сработает по каждому атрибуту, которого в цели нет." }],
      onSubmit: (v) => mutate(() => api(`/catalog/rules/${enc(id)}/targets`,
        { method: "PUT", body: { targets: v.targets } }), "Привязка обновлена"),
    });
  },

  "rule-move"(id) {
    openForm({
      title: "Перенести правило в другой пункт",
      fields: [{ name: "parentNodeId", label: "Пункт", type: "select",
        options: clauseOptions(null) }],
      onSubmit: (v) => mutate(() => api(`/catalog/rules/${enc(id)}/move`,
        { method: "POST", body: { parentNodeId: v.parentNodeId } }), "Правило перенесено"),
    });
  },

  "example-add"(ruleNodeId) {
    const r = findAny(ruleNodeId) || {};
    openForm({
      title: "Пример к правилу " + (r.ruleId || ""),
      submitLabel: "Добавить",
      fields: [
        { name: "text", label: "Формулировка", type: "textarea", required: true },
        { name: "isViolation", label: "Это пример нарушения", type: "checkbox",
          value: r.type === "PROHIBITION",
          hint: r.type === "PROHIBITION"
            ? "Запрет показывает в ответе именно примеры нарушений — галочку обычно оставляют."
            : "Требование показывает в ответе образцы правильных формулировок — галочку обычно снимают." },
      ],
      onSubmit: (v) => mutate(() => api("/catalog/examples", { method: "POST",
        body: { ruleNodeId, text: v.text, isViolation: v.isViolation } }), "Пример добавлен"),
    });
  },

  "example-edit"(id) {
    const ex = findAny(id) || {};
    openForm({
      title: "Пример " + (ex.exampleId || ""),
      fields: [
        { name: "text", label: "Формулировка", type: "textarea", value: ex.text, required: true },
        { name: "isViolation", label: "Это пример нарушения", type: "checkbox", value: !!ex.isViolation },
        { name: "exampleId", label: "Идентификатор (exampleId)", value: ex.exampleId || "", required: true },
      ],
      onSubmit: (v) => mutate(() => patchProps(id, v), "Пример обновлён"),
    });
  },

  async "example-del"(id) {
    const ok = await confirmDialog({
      title: "Удалить пример?", danger: true, confirmLabel: "Удалить",
      message: "<p>Пример будет удалён из базы. Примеры не архивируются — их легко создать заново.</p>",
    });
    if (!ok) return;
    await mutate(() => api(`/catalog/nodes/${enc(id)}`, { method: "DELETE" }), "Пример удалён");
  },

  "target-add"() {
    openForm({
      title: "Новый атрибут", submitLabel: "Создать",
      fields: [
        { name: "name", label: "Имя", required: true, placeholder: "срок_исполнения",
          hint: "Написание с пробелом и с подчёркиванием считается одним атрибутом — двойник создать не получится." },
        { name: "description", label: "Описание для модели", type: "textarea", required: true,
          placeholder: "в цели указан проверяемый срок: конкретная дата, месяц, квартал или год",
          hint: "Это перечисление признаков, по которым модель решает, есть атрибут в цели или нет." },
      ],
      onSubmit: (v) => mutate(() => api("/catalog/check-targets", { method: "POST", body: v }),
        "Атрибут создан"),
    });
  },

  "target-edit"(id) {
    const t = findAny(id) || {};
    openForm({
      title: "Атрибут " + (t.name || ""),
      fields: [
        { name: "name", label: "Имя", value: t.name, required: true,
          hint: "Переименование не меняет привязку правил: связь идёт по узлу." },
        { name: "description", label: "Описание для модели", type: "textarea",
          value: t.description, required: true },
      ],
      onSubmit: (v) => mutate(() => patchProps(id, v), "Атрибут обновлён"),
    });
  },
};

document.addEventListener("click", (event) => {
  const trigger = event.target.closest("[data-menu]");
  if (!event.target.closest(".popup") && !trigger) closeMenu();
  if (trigger) { event.stopPropagation(); openMenu(trigger); return; }

  const button = event.target.closest("[data-act]");
  if (!button) return;
  const action = ACTIONS[button.dataset.act];
  if (!action) return;
  event.stopPropagation();
  closeMenu();
  Promise.resolve(action(button.dataset.id)).catch((err) => toast(err.message, "err"));
});
addEventListener("scroll", closeMenu, true);
addEventListener("resize", closeMenu);

/* --------------------------- переход к объекту --------------------------- */

function flash(nodeId) {
  const el = document.querySelector(`[data-node="${CSS.escape(nodeId)}"]`);
  if (!el) return false;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
  return true;
}

async function goToNode(nodeId, kind) {
  if (kind === "CheckTarget") {
    switchTab("targets");
    if (!flash(nodeId)) {
      $("#showArchivedTargets").checked = state.showArchivedTargets = true;
      await reload();
      flash(nodeId);
    }
    return;
  }
  switchTab("catalog");
  let order = orderOf(nodeId) || byNode(allOrders(), nodeId);
  if (!order) {
    $("#showArchived").checked = state.showArchived = true;
    await reload();
    order = orderOf(nodeId) || byNode(allOrders(), nodeId);
  }
  if (order) {
    state.open.add(order.nodeId);
    // Пункты свёрнуты по умолчанию — раскрываем тот, внутри которого искомый узел.
    for (const clause of order.clauses || []) {
      const inside = clause.nodeId === nodeId
        || (clause.rules || []).some((r) => r.nodeId === nodeId
            || (r.examples || []).some((e) => e.nodeId === nodeId));
      if (inside) state.openClauses.add(clause.nodeId);
    }
    renderCatalog();
  }
  if (!flash(nodeId)) toast("Объект не найден в текущем представлении", "err");
}

/* --------------------------- проверка цели ------------------------------- */

const STATUS_VIEW = {
  ALLOWED: { text: "Нарушений нет", cls: "ok" },
  VIOLATIONS_FOUND: { text: "Найдены нарушения", cls: "warn" },
  NEEDS_MANUAL_REVIEW: { text: "Требуется ручная проверка", cls: "warn" },
};

async function runCheck() {
  const goal = $("#goalInput").value.trim();
  if (!goal) { toast("Введите формулировку цели", "err"); return; }
  const button = $("#checkBtn");
  button.disabled = true;
  button.innerHTML = '<span class="spinner"></span> Проверяем…';
  $("#checkResult").innerHTML = "";
  try {
    const result = await api("/check-goal", { method: "POST", body: { goal } });
    const view = STATUS_VIEW[result.status] || { text: result.status, cls: "archived" };
    $("#checkResult").innerHTML = `<div class="panel" style="margin-top:16px">
      <div class="row" style="align-items:center;gap:10px;flex-wrap:wrap">
        <span class="badge ${view.cls}">${esc(view.text)}</span>
        <span class="dim">атрибуты в цели: ${
          (result.detected_attributes || []).length
            ? result.detected_attributes.map((a) => `<span class="chip">${esc(a)}</span>`).join(" ")
            : "не найдены"}</span>
      </div>
      ${(result.notes || []).length ? `<div style="margin-top:12px">${
        result.notes.map((n) => `<div class="badge warn" style="display:block;margin-top:6px;white-space:normal">${esc(n)}</div>`).join("")
      }</div>` : ""}
      ${(result.violations || []).map((v) => `<div class="violation">
        <div class="rule-meta">
          <span class="badge ${v.violation_type === "PROHIBITION" ? "prohibition" : "requirement"}">
            ${v.violation_type === "PROHIBITION" ? "Запрет нарушен" : "Требование не выполнено"}</span>
          <span class="mono">${esc(v.order_number || "")} ${esc(v.clause_code || "")}</span>
          <span class="chip">${esc(v.attribute)}</span>
        </div>
        <div>${esc(v.rule_text || "")}</div>
        ${v.check_instruction ? `<div class="dim" style="margin-top:6px">${esc(v.check_instruction)}</div>` : ""}
        ${(v.examples || []).filter(Boolean).length ? `<div class="examples">${
          v.examples.filter(Boolean).map((ex) => `<div class="example ${
            v.example_kind === "violation" ? "bad" : "good"}">
            <span class="mark">${v.example_kind === "violation" ? "✗" : "✓"}</span>
            <span>${esc(ex)}</span></div>`).join("")}</div>` : ""}
      </div>`).join("")}
    </div>`;
  } catch (err) {
    toast(err.message, "err");
  } finally {
    button.disabled = false;
    button.textContent = "Проверить";
  }
}

/* ---------------------------- диагностика -------------------------------- */

const SEVERITY = {
  error: { label: "Ошибка", cls: "err" },
  warning: { label: "Предупреждение", cls: "warn" },
  info: { label: "Справочно", cls: "archived" },
};

async function refreshHealthBadge() {
  try {
    const report = await api("/catalog/diagnostics");
    const badge = $("#healthCount");
    const errors = report.counts.error;
    badge.textContent = errors || report.counts.warning || "";
    badge.className = "badge count " + (errors ? "err" : report.counts.warning ? "warn" : "hidden");
  } catch { /* значок необязателен */ }
}

async function loadHealth() {
  $("#healthPanel").innerHTML = '<div class="panel"><span class="spinner"></span> Проверяем…</div>';
  let report;
  try {
    report = await api("/catalog/diagnostics");
  } catch (err) {
    $("#healthPanel").innerHTML = `<div class="panel"><span class="badge warn">API недоступен</span>
      <div class="dim" style="margin-top:8px">${esc(err.message)}</div></div>`;
    return;
  }

  const summary = `<div class="panel" style="margin-bottom:16px">
    <div class="row" style="align-items:center;gap:10px;flex-wrap:wrap">
      <span class="badge ${report.ready ? "ok" : "err"}">
        ${report.ready ? "Граф готов к проверкам" : "Граф не готов к проверкам"}</span>
      <span class="dim">активных атрибутов: ${report.check_targets} ·
        ошибок: ${report.counts.error} · предупреждений: ${report.counts.warning}</span>
    </div>
    ${report.ready ? "" : `<div class="dim" style="margin-top:8px">
      Пока есть ошибки, <span class="mono">/ready</span> отдаёт 503: проверка целей
      даёт неполный или неверный результат.</div>`}
  </div>`;

  const issues = report.issues.map((issue) => {
    const sev = SEVERITY[issue.severity] || SEVERITY.info;
    return `<div class="issue ${esc(issue.severity)}">
      <h4><span class="badge ${sev.cls}">${sev.label}</span> ${esc(issue.title)}
        ${issue.items.length ? `<span class="badge count">${issue.items.length}</span>` : ""}</h4>
      <div class="detail">${esc(issue.detail)}</div>
      ${issue.fix ? `<div style="margin-top:11px">
        <button class="btn sm primary" data-fix="${esc(issue.fix.action)}">${esc(issue.fix.label)}</button>
      </div>` : ""}
      ${issue.items.length ? `<div class="items">${issue.items.map((item) => `
        <div class="item"><span>${esc(item.label)}</span>
          ${item.nodeId ? `<button class="btn sm ghost" data-goto="${esc(item.nodeId)}"
            data-kind="${esc(item.kind || "")}">Показать</button>` : ""}</div>`).join("")}</div>` : ""}
    </div>`;
  }).join("");

  $("#healthPanel").innerHTML = summary + (issues ||
    '<div class="empty">Проблем не найдено — граф внутренне непротиворечив.</div>');
  refreshHealthBadge();
}

$("#healthPanel").addEventListener("click", async (event) => {
  const goto = event.target.closest("[data-goto]");
  if (goto) { await goToNode(goto.dataset.goto, goto.dataset.kind); return; }

  const fix = event.target.closest("[data-fix]");
  if (!fix) return;
  if (fix.dataset.fix !== "repair_identifiers") return;
  const ok = await confirmDialog({
    title: "Проставить идентификаторы?",
    confirmLabel: "Проставить",
    message: `<p>Узлам без <span class="mono">orderId</span> /
      <span class="mono">clauseId</span> / <span class="mono">ruleId</span> /
      <span class="mono">exampleId</span> будут присвоены значения, выведенные
      из номера, кода или внутреннего идентификатора.</p>
      <p class="muted">Существующие идентификаторы не меняются. Узлам без
      <span class="mono">status</span> проставится <span class="mono">active</span>.</p>`,
  });
  if (!ok) return;
  fix.disabled = true;
  fix.innerHTML = '<span class="spinner"></span> Чиним…';
  try {
    const report = await api("/catalog/repair-identifiers", { method: "POST" });
    toast(`Проставлено: приказов ${report.orders}, пунктов ${report.clauses}, `
        + `правил ${report.rules}, примеров ${report.examples}, статусов ${report.statuses}`, "ok");
    await reload();
    await loadHealth();
  } catch (err) {
    toast(err.message, "err");
    fix.disabled = false;
  }
});

/* ------------------------------- вкладки --------------------------------- */

function render() {
  renderCatalog();
  renderTargets();
}

function switchTab(tab) {
  state.tab = tab;
  for (const b of document.querySelectorAll("nav button"))
    b.setAttribute("aria-selected", String(b.dataset.tab === tab));
  for (const id of ["catalog", "targets", "check", "health"])
    document.getElementById("tab-" + id).classList.toggle("hidden", id !== tab);
  if (tab === "health") loadHealth();
}

for (const b of document.querySelectorAll("nav button")) b.onclick = () => switchTab(b.dataset.tab);
$("#addOrder").onclick = () => ACTIONS["order-add"]();
$("#addTarget").onclick = () => ACTIONS["target-add"]();
$("#reloadBtn").onclick = reload;
$("#healthRefresh").onclick = loadHealth;
$("#checkBtn").onclick = runCheck;
$("#search").oninput = (e) => { state.search = e.target.value; renderCatalog(); };
$("#showArchived").onchange = (e) => { state.showArchived = e.target.checked; reload(); };
$("#showArchivedTargets").onchange = (e) => { state.showArchivedTargets = e.target.checked; reload(); };
$("#expandAll").onclick = () => {
  for (const o of allOrders()) {
    state.open.add(o.nodeId);
    for (const c of o.clauses || []) state.openClauses.add(c.nodeId);
  }
  renderCatalog();
};
$("#collapseAll").onclick = () => {
  state.open.clear();
  state.openClauses.clear();
  renderCatalog();
};
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeMenu(); closeModal(); }
});

reload();
</script>
