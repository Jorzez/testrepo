# Надстройка для машины С ИНТЕРНЕТОМ: разработка, стенд, первичная проверка.
#
#   docker compose -f docker-compose.yml -f docker-compose.online.yml up -d --build
#
# Снимает запреты базового файла: образы докачиваются, если их нет локально,
# а vLLM берёт веса с Hugging Face в кэш-том, как раньше. Образ API и здесь
# собирается из api/vendor/wheels — колёса лежат в git, к PyPI ходить незачем.
# Образ интерфейса собирается здесь же: npm ci берёт пакеты из реестра.
# Сервер без интернета этот файл не использует.

services:
  neo4j:
    pull_policy: missing
  seeder:
    pull_policy: build
  api:
    pull_policy: build
  web:
    pull_policy: build
  vllm:
    pull_policy: missing
    environment:
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command: >
      --model ${VLLM_MODEL}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization 0.90
    volumes:
      - hf_cache:/root/.cache/huggingface

volumes:
  hf_cache:
