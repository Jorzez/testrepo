services:
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"    # браузер
      - "7687:7687"    # bolt
    volumes:
      - neo4j_data:/data
      - ./neo4j/init:/init
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      retries: 10

  vllm:
    image: vllm/vllm-openai:latest
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    command: >
      --model ${VLLM_MODEL}
      --max-model-len 8192
      --gpu-memory-utilization 0.90
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build: ./api
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      VLLM_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL}
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy

  web:
    image: nginx:alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "3000:80"

volumes:
  neo4j_data:
  hf_cache: